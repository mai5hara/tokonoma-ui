name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Landing at /tokonoma-ui/ — Storybook at /tokonoma-ui/storybook/
      - name: Build landing page
        run: pnpm build:landing
        env:
          SITE_BASE_PATH: /tokonoma-ui/

      - name: Build Storybook
        run: pnpm exec storybook build -o dist-site/storybook
        env:
          STORYBOOK_BASE_PATH: /tokonoma-ui/storybook/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
